<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JV Assessoria Contábil | Site em Construção</title>
  <meta name="description" content="JV Assessoria Contábil - Site em construção.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0D1B2A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .logo {
      width: 220px;
      height: 220px;
      object-fit: contain;
      animation: pulse 3.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.3));
      }
      50% {
        transform: scale(1.07);
        filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.7));
      }
    }

    h1 {
      margin-top: 2rem;
      font-family: 'Cinzel', serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #D4AF37;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="JV Assessoria Contábil" class="logo">
  <h1>Site em Construção</h1>
</body>
</html>
